name: Setup
description: Node from .nvmrc, pnpm through corepack, the workspace installed from the lockfile, and Chromium when asked.

inputs:
  chromium:
    description: Install Chromium for Playwright (Storybook tests and the browser specs), cached by Playwright version
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Enable corepack
      shell: bash
      run: corepack enable
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    # The browser binaries are keyed by the Playwright version the lockfile resolves; the system packages
    # Chromium needs are installed on every run (`install-deps`), since the runner image changes under them.
    - name: Resolve the Playwright version
      if: ${{ inputs.chromium == 'true' }}
      id: playwright
      shell: bash
      run: echo "version=$(pnpm --filter @am/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - name: Cache the Playwright browsers
      if: ${{ inputs.chromium == 'true' }}
      id: browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - name: Install Chromium
      if: ${{ inputs.chromium == 'true' && steps.browsers.outputs.cache-hit != 'true' }}
      shell: bash
      run: pnpm --filter @am/e2e exec playwright install --with-deps chromium
    - name: Install the system packages of Chromium
      if: ${{ inputs.chromium == 'true' && steps.browsers.outputs.cache-hit == 'true' }}
      shell: bash
      run: pnpm --filter @am/e2e exec playwright install-deps chromium
