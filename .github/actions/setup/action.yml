name: Setup
description: Node from .nvmrc, pnpm through corepack, the workspace installed from the lockfile, and Chromium when asked.

inputs:
  chromium:
    description: Install Chromium for Playwright (Storybook tests and the browser specs)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Enable corepack
      shell: bash
      run: corepack enable
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Install Chromium
      if: ${{ inputs.chromium == 'true' }}
      shell: bash
      run: pnpm --filter @am/e2e exec playwright install --with-deps chromium
