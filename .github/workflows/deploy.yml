---
name: Deploy

# Push to main: the CI gates run, the three images are built (nothing is published yet), published to
# GHCR tagged with the commit SHA, and Coolify is pointed at that tag. Manual run with `tag`: rollback,
# which skips gates and build, checks that the tag exists in GHCR and redeploys it.
# Secrets: COOLIFY_URL, COOLIFY_TOKEN, COOLIFY_RESOURCE_UUID. Repository variable: WEB_PUBLIC_URL.
# See docs/runbooks/production-deploy.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to redeploy (a commit SHA already published); empty runs the full pipeline
        required: false
        type: string

# Read-only token for every job; only `publish` asks for more.
permissions:
  contents: read

# One deploy at a time; a running deploy is never cancelled.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  preflight:
    name: Check secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
      WEB_PUBLIC_URL: ${{ vars.WEB_PUBLIC_URL }}
    steps:
      # Fails before anything is published; only the names are printed, never a value.
      - name: Require the deploy secrets and variables
        run: |
          missing=0
          for name in COOLIFY_URL COOLIFY_TOKEN COOLIFY_RESOURCE_UUID WEB_PUBLIC_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set (see docs/runbooks/production-deploy.md)"
              missing=1
            fi
          done
          exit "$missing"

  gates:
    name: Gates
    if: ${{ inputs.tag == '' }}
    needs: preflight
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.name }}
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: api, context: ., file: apps/api/Dockerfile }
          - { name: web, context: ., file: apps/web/Dockerfile }
          - { name: backup, context: infra/backup, file: infra/backup/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Builds only: a failing image stops the run before any image is published.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  publish:
    name: Publish ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: api, context: ., file: apps/api/Dockerfile }
          - { name: web, context: ., file: apps/web/Dockerfile }
          - { name: backup, context: infra/backup, file: infra/backup/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GHCR wants a lowercase path.
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}

  release:
    name: Release to Coolify
    needs: [preflight, publish]
    # Runs after a successful publish, or on a manual rollback (gates, build and publish are skipped).
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag exists in GHCR
        if: ${{ inputs.tag != '' }}
        run: |
          IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}" infra/deploy/check-tag.sh "$TAG"
      - name: Point Coolify at the tag and deploy
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
        run: infra/deploy/coolify.sh "$TAG"
      - name: Wait for the new version
        env:
          WEB_PUBLIC_URL: ${{ vars.WEB_PUBLIC_URL }}
        run: infra/deploy/smoke.sh "$WEB_PUBLIC_URL"
