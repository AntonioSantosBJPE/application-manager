name: CI

on:
  pull_request:
  push:
    branches: [main]

# Unit and integration tests run on every PR. The end-to-end tests and the image builds are off for
# now (they run locally, see docs/workflow.md) until the first VPS deploy flow exists. They are gated
# on the repository variable CI_FULL; to turn them back on, set CI_FULL=true (Settings > Secrets and
# variables > Actions > Variables) or drop the gated `if:` lines.

# Read-only token for every job; no job asks for more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The storybook project of @am/ui renders every story in headless Chromium.
      - name: Install Chromium for Storybook tests
        run: pnpm --filter @am/ui exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  repo-rules:
    name: Repository rules (planted violations)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The copy's `pnpm test` renders the stories of @am/ui in headless Chromium.
      - name: Install Chromium for Storybook tests
        run: pnpm --filter @am/ui exec playwright install --with-deps chromium
      # Runs the real root commands over a copy of the repo with a violation planted; slow, so its own job.
      - run: pnpm test:repo-rules

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers starts PostgreSQL 18 on the runner's Docker.
      - run: pnpm test:integration

  e2e:
    name: End-to-end tests
    if: ${{ vars.CI_FULL == 'true' }} # off until the VPS flow; see header
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create .env from the example (placeholder values only)
        run: cp .env.example .env
      - name: Install Chromium for the browser specs
        run: pnpm --filter @am/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Same image, by digest, as scripts/gitleaks-staged.sh.
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks over the whole git history
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" git --no-banner --no-color --redact --verbose /repo

  images:
    name: Build images
    if: ${{ vars.CI_FULL == 'true' }} # off until the VPS flow; see header
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build api image
        run: docker build --file apps/api/Dockerfile --tag am-api:ci .
      - name: Build web image
        run: docker build --file apps/web/Dockerfile --tag am-web:ci .

  workflow-lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -color
