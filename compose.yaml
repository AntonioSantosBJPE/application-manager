# The local stack: postgres, a one-shot migrate, the api and the web, built from the production images.
# Variables come from the environment or from .env (see .env.example); each service gets its own list explicitly.
# Ports are published from WEB_PORT, API_PORT and POSTGRES_PORT so several worktrees can run side by side.

x-api-image: &api-image
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  # migrate runs the same image as the api with another entrypoint.
  image: ${COMPOSE_PROJECT_NAME:-application-manager}-api

x-database-url: &database-url postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}

services:
  postgres:
    # Pinned by tag and digest (refresh with `docker buildx imagetools inspect postgres:18.6-alpine`).
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep PGDATA in a versioned folder under /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *api-image
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL: *database-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    environment:
      DATABASE_URL: *database-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "3333"
    ports:
      - "${API_PORT:-3333}:3333"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Healthy means the process answers: /health is 503 while the database is down, and that is not an api failure.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/health').then(() => process.exit(0), () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-application-manager}-web
    environment:
      API_INTERNAL_URL: http://api:3333
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "3000"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      # The web starts even when the api is broken: the page then shows "Indisponível".
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
