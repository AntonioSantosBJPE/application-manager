<!-- @dsCard group="Páginas atuais" height=800 width=1280 page subtitle="/invite/$token" -->
<!doctype html>
<html lang="pt-BR">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>PageInvite</title><style>body{min-height:800px;overflow:hidden;position:relative}</style></head>
<body>
<main class="am-auth" data-archetype="auth">
<div class="am-auth__col">
  <div class="am-auth__head"><svg class="am-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12.5" fill="none" stroke="currentColor" stroke-width="3"/><path d="M16 16H23A7 7 0 1 1 16 9Z" fill="currentColor"/></svg>
    <div class="am-stack" style="gap:4px"><h1 class="am-h-xl">Criar conta</h1><p class="am-muted">Você foi convidada para o Rumo Carreira.</p></div></div>
  <form class="am-auth__form" novalidate>
    <div class="am-field"><label for="e">E-mail</label><input id="e" class="am-input" readonly value="marina@exemplo.com"></div>
    <div class="am-field"><label for="n">Nome</label><input id="n" class="am-input" autocomplete="name" value="Marina Alves"></div>
    <div class="am-field am-field--invalid"><label for="p">Senha</label><input id="p" class="am-input" type="password" aria-invalid="true" value="•••••••">
      <p class="am-field__hint">Use de 12 a 128 caracteres.</p>
      <p class="am-field__error"><i data-lucide="circle-alert" class="am-icon-sm"></i>A senha precisa ter de 12 a 128 caracteres.</p></div>
    <button class="am-btn am-btn--primary" type="button">Criar conta</button>
  </form>
  <p class="am-auth__foot">O convite vale até <span class="am-mono">15 nov 2026</span>.</p>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>window.lucide && lucide.createIcons();</script>
</body>
</html>
