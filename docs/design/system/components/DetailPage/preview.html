<!doctype html>
<html lang="pt-BR">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>DetailPage</title>
<style>body{padding:16px;} .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;} .col{display:flex;flex-direction:column;gap:12px;} </style>
</head>
<body>
<div class="am-detail" style="border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;min-height:300px">
<div class="am-detail__main" style="padding:20px">
  <div class="am-stack"><span class="am-caption am-muted">Acme Pagamentos</span><h1 class="am-h-lg">Desenvolvedor Backend Pleno</h1></div>
  <div class="am-section"><h2 class="am-h-sm">Main</h2><p class="am-muted">Conteúdo do item: descrição, skills, linha do tempo.</p></div>
</div>
<aside class="am-detail__side" aria-label="Propriedades">
  <dl class="am-props">
    <dt>Status</dt><dd class="am-editable"><span class="am-status" data-status="interviewing"><span class="am-sicon"></span><span class="am-status__label">Em entrevistas</span></span></dd>
    <dt>Nível</dt><dd class="am-editable">Pleno</dd>
    <dt>Modelo</dt><dd class="am-editable">Remoto</dd>
    <dt>Atividade</dt><dd><span class="am-mono">06 nov 2026</span></dd>
  </dl>
</aside></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>window.lucide && lucide.createIcons();</script>
</body>
</html>
