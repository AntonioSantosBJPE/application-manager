<!doctype html>
<html lang="pt-BR">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>FormPage</title>
<style>body{padding:16px;} .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;} .col{display:flex;flex-direction:column;gap:12px;} </style>
</head>
<body>
<div style="border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden">
<div class="am-form" style="grid-template-columns:160px minmax(0,1fr);padding:20px;gap:24px">
  <nav class="am-form__toc" aria-label="Seções"><a class="am-nav" aria-current="page">Perfil</a><a class="am-nav">Experiência</a><a class="am-nav">Projetos</a><a class="am-nav">Formação</a></nav>
  <div class="am-form__sections"><section class="am-form__section"><h2 class="am-h-md">Perfil</h2>
    <div class="am-form-grid"><div class="am-field"><label>Nome completo</label><input class="am-input" value="Marina Alves"></div><div class="am-field"><label>Título</label><input class="am-input" value="Desenvolvedora Full Stack"></div></div>
  </section></div>
</div>
<div class="am-form__actions"><span class="am-caption am-muted" style="margin-right:auto;align-self:center">Salvo automaticamente às 14:32</span><button class="am-btn am-btn--secondary">Visualizar PDF</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>window.lucide && lucide.createIcons();</script>
</body>
</html>
